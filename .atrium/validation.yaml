# Validation profile for app-engine: the repo's declared test contract, read by
# Atrium's Verify toggle and test gate (see Atrium's docs/validation-profiles.md).
# Commands run from the repo root; the project venv lives at .venv.
version: 1

commands:
  test: ".venv/bin/python -m pytest --tb=short -q --timeout=30 -x"
  scoped_test: ".venv/bin/python -m pytest {files} -q"
  typecheck: ".venv/bin/python -m compileall -q ."

discovery:
  framework: pytest
  test_globs:
    - "tests/test_*.py"
    - "tests/**/*_test.py"
  # smoke: []       # always-run canaries (cheap, fast tests)
  # quarantine: []  # known-flaky tests that must never gate

