name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  locked-inputs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.1'
      - name: Verify dependency exports match the reviewed lock
        run: |
          uv lock --check
          uv export --locked --no-dev --no-emit-project -o requirements.txt >/dev/null
          uv export --locked --no-emit-project -o requirements-dev.txt >/dev/null
          uv export --locked --group browser --no-emit-project -o requirements-browser.txt >/dev/null
          uv pip compile --universal --python-version 3.10 --generate-hashes deploy/package-tracker/requirements.in -o deploy/package-tracker/requirements.txt >/dev/null
          git diff --exit-code -- uv.lock requirements.txt requirements-dev.txt requirements-browser.txt deploy/package-tracker/requirements.txt
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.1'
      - run: uv sync --python 3.12.15 --locked --all-groups --no-install-project
      - run: uv run --no-sync python -m playwright install --with-deps chromium
      - run: uv run --no-sync python -m pytest browser_tests/ -vv --timeout=90 --basetemp=browser-test-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: browser-test-results
  test:
    strategy:
      fail-fast: false
      matrix:
        # Intel macOS remains the supported CI image while ARM runner loopback
        # startup regressions are investigated separately.
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
        python: ['3.10.22', '3.11.17', '3.12.15', '3.13.16']
    runs-on: ${{ matrix.os }}
    steps:
      # Cross-repo tutor checks use fixtures: personal-apps is private.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: app-engine
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.1'
      - run: uv sync --python ${{ matrix.python }} --locked --no-install-project
        working-directory: app-engine
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.5'
      - run: npm ci --ignore-scripts
        working-directory: app-engine
      - run: npm test
        working-directory: app-engine
      - run: uv run --no-sync python scripts/ci-loopback-probe.py
        if: runner.os == 'macOS'
        working-directory: app-engine
      - run: uv run --no-sync python -m pytest tests/ -vv --timeout=60
        working-directory: app-engine
      - run: node --test "app_engine/multiplayer/test/*.test.mjs"
        working-directory: app-engine
        shell: bash
