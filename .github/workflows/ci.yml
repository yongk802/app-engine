name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest (macOS 26 ARM) currently times out all subprocess
        # loopback health checks, including on main. Keep full macOS coverage
        # on the stable Intel image while investigating that runner regression.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      # personal-apps is private, so CI can't check it out; the cross-repo tutor
      # checks skip and the catalog tests use tests/fixtures (run them locally
      # against a personal-apps clone before a release).
      - uses: actions/checkout@v4
        with:
          path: app-engine
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: app-engine/requirements*.txt
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install -r requirements-dev.txt
        working-directory: app-engine
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/ci-loopback-probe.py
        if: runner.os == 'macOS'
        working-directory: app-engine
      - run: python -m pytest tests/ -vv --timeout=60
        working-directory: app-engine
      - run: node --test "app_engine/multiplayer/test/*.test.mjs"
        working-directory: app-engine
        shell: bash

