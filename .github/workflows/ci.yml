name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app-engine
      - uses: actions/checkout@v4
        with:
          repository: yongk802/personal-apps
          path: personal-apps
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: app-engine/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
        working-directory: app-engine
      - run: python -m pytest tests/ -q
        working-directory: app-engine
        env:
          PERSONAL_APPS_DIR: ${{ github.workspace }}/personal-apps

