<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App Engine Studio</title>
<style>
:root{color-scheme:dark;--bg:#0c1018;--panel:#151b27;--line:#2a3446;--text:#edf2ff;--muted:#9ba8bd;--accent:#78a6ff;--good:#5ed6a0;--bad:#ff7e8b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#18233a,var(--bg) 40%);color:var(--text);font:15px/1.5 system-ui,sans-serif}header{padding:28px clamp(20px,5vw,72px) 18px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:28px}header p{margin:5px 0 0;color:var(--muted)}nav{display:flex;gap:8px;padding:14px clamp(20px,5vw,72px);position:sticky;top:0;background:#0c1018e8;backdrop-filter:blur(12px);z-index:2;border-bottom:1px solid var(--line)}button{border:1px solid var(--line);border-radius:9px;background:#1b2433;color:var(--text);padding:9px 13px;cursor:pointer;font:inherit}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#07101f;font-weight:700}button:disabled{opacity:.45}.view{display:none;max-width:1100px;margin:auto;padding:28px 20px 80px}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px}.card h3{margin:0 0 5px}.muted{color:var(--muted)}form{display:grid;gap:13px;max-width:760px}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}label{display:grid;gap:5px;color:var(--muted)}input,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#0e1420;color:var(--text);padding:10px;font:inherit}pre{white-space:pre-wrap;background:#090d14;border:1px solid var(--line);border-radius:9px;padding:13px;max-height:350px;overflow:auto}.status{min-height:24px;margin:12px 0}.ok{color:var(--good)}.error{color:var(--bad)}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);font-size:12px}dialog{width:min(720px,92vw);background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:20px}dialog::backdrop{background:#000a}.actions,.app-actions{display:flex;gap:9px;flex-wrap:wrap}.app-actions{margin-top:13px}@media(max-width:650px){.row{grid-template-columns:1fr}nav{overflow:auto}}
</style></head><body>
<header><h1>App Studio</h1><p>Create, import, configure, launch, and diagnose portable apps.</p></header>
<nav><button data-view="apps" class="active">Apps</button><button data-view="create">Create</button><button data-view="import">Import</button><button data-view="diagnostics">Diagnose</button></nav>
<main>
<section id="apps" class="view active"><div class="actions"><button id="refresh-apps">Refresh</button></div><p id="apps-status" class="status"></p><div id="app-grid" class="grid"></div></section>
<section id="create" class="view"><h2>Create an app</h2><p class="muted">Pick a language. Studio writes the JSON contract and a runnable starter.</p><form id="create-form"><div class="row"><label>Template<select name="template_id" required></select></label><label>Destination root<select name="root" required></select></label></div><div class="row"><label>Folder name<input name="directory_name" value="my-app" required></label><label>App id<input name="app_id" value="my-app" pattern="[a-z0-9][a-z0-9-]*" required></label></div><div class="row"><label>Display name<input name="label" value="My App" required></label><label>Icon<input name="icon" value="✨" required></label></div><div class="actions"><button type="submit" class="primary">Preview project</button><button type="button" id="create-confirm" disabled>Create files</button></div></form><p id="create-status" class="status"></p><pre id="create-plan" hidden></pre></section>
<section id="import" class="view"><h2>Import a project</h2><form id="import-form"><label>Existing project directory<input name="path" required placeholder="/path/to/project"></label><button class="primary">Inspect project</button></form><p id="import-status" class="status"></p><pre id="import-result" hidden></pre></section>
<section id="diagnostics" class="view"><h2>Diagnostics</h2><button id="run-diagnostics" class="primary">Run diagnostics</button><p id="diagnostics-status" class="status"></p><div class="grid"><div class="card"><h3>Runtime</h3><pre id="runtime-diagnostics">Not checked</pre></div><div class="card"><h3>Toolchains</h3><div id="toolchains">Not checked</div></div></div></section>
</main>
<dialog id="config-dialog"><form method="dialog"><h2 id="config-title">Configure app</h2><div id="config-fields"></div><p id="config-status" class="status"></p><div class="actions"><button value="cancel">Cancel</button><button id="save-config" value="default" class="primary">Save</button></div></form></dialog>
<meta name="app-engine-csrf-url" content="">
<script>
const API='/api/app-engine',CSRF_URL=document.querySelector('meta[name="app-engine-csrf-url"]')?.content||'';let csrfToken='',createFingerprint=null,createPayload=null,configuringApp=null;const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function csrf(){if(!CSRF_URL||csrfToken)return csrfToken;const r=await fetch(CSRF_URL,{credentials:'same-origin'});if(r.ok)csrfToken=(await r.json()).csrf_token||'';return csrfToken}async function api(path,opts={}){const method=(opts.method||'GET').toUpperCase(),headers={'content-type':'application/json',...(opts.headers||{})};if(['POST','PUT','PATCH','DELETE'].includes(method)){const token=await csrf();if(token)headers['X-CSRF-Token']=token}const r=await fetch(API+path,{credentials:'same-origin',...opts,headers});let body;try{body=await r.json()}catch{body=await r.text()}if(!r.ok){const e=new Error(body?.detail?.message||body?.detail?.code||body?.detail||`HTTP ${r.status}`);e.body=body;e.status=r.status;throw e}return body}function status(id,msg,ok=true){const e=$(id);e.textContent=msg;e.className='status '+(ok?'ok':'error')}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.view').forEach(e=>e.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.view).classList.add('active')});
async function loadApps(){status('#apps-status','Loading…');try{const d=await api('/catalog');$('#app-grid').innerHTML=d.apps.map(a=>`<article class="card"><span class="pill">${esc(a.targets.map(t=>t.kind).join(', '))}</span><h3>${esc(a.icon)} ${esc(a.label)}</h3><p class="muted">${esc(a.description||a.id)}</p><div class="app-actions"><button onclick="openApp('${esc(a.id)}')">Open</button><button onclick="configure('${esc(a.id)}')">Configure</button></div></article>`).join('')||'<p>No apps found. Create one in the next tab.</p>';status('#apps-status',`${d.apps.length} apps · generation ${d.generation}`)}catch(e){status('#apps-status',e.message,false)}}
async function openApp(id){try{let o;try{o=await api(`/apps/${id}/open`,{method:'POST',body:'{}'})}catch(e){const d=e.body?.detail;if(e.status!==409||d?.code!=='approval_required')throw e;const steps=(d.steps||[]).map(s=>`${s.phase}: ${(s.argv||[]).join(' ')}`).join('\n');if(!confirm(`Approve this local process plan?\n\n${steps||'The app requests a managed local process.'}`))return;await api(`/plans/${d.fingerprint}/approve`,{method:'POST'});o=await api(`/apps/${id}/open`,{method:'POST',body:'{}'})}location.href=o.entry_url||o.url||API+`/sessions/${o.session_id}/assets/index.html`}catch(e){status('#apps-status',e.message,false)}}
async function configure(id){try{const f=await api(`/apps/${id}/configuration`);configuringApp=id;$('#config-title').textContent=`Configure ${id}`;$('#config-fields').innerHTML=f.fields.map(x=>`<label>${esc(x.label)}${x.required?' *':''}<input data-key="${esc(x.key)}" data-secret="${x.value_type==='secret'}" type="${x.value_type==='secret'?'password':'text'}" placeholder="${x.value_type==='secret'?'Leave blank to keep current':''}"><small>${esc(x.description||'')}</small></label>`).join('')||'<p>No configuration fields.</p>';$('#config-dialog').showModal()}catch(e){status('#apps-status',e.message,false)}}
$('#save-config').onclick=async e=>{e.preventDefault();const values=[...$('#config-fields').querySelectorAll('input')].filter(i=>i.value).map(i=>({key:i.dataset.key,value:i.value,secret:i.dataset.secret==='true'}));try{await api(`/apps/${configuringApp}/configuration`,{method:'PUT',body:JSON.stringify({values})});status('#config-status','Saved');setTimeout(()=>$('#config-dialog').close(),400)}catch(x){status('#config-status',x.message,false)}};
async function loadCreate(){try{const[t,r]=await Promise.all([api('/studio/templates'),api('/studio/roots')]);$('[name=template_id]').innerHTML=t.map(x=>`<option value="${esc(x.template_id)}">${esc(x.label)}${x.available?'':' (toolchain missing)'}</option>`).join('');$('[name=root]').innerHTML=r.filter(x=>x.create).map(x=>`<option>${esc(x.root)}</option>`).join('')}catch(e){status('#create-status',e.message,false)}}
$('#create-form').onsubmit=async e=>{e.preventDefault();createPayload=Object.fromEntries(new FormData(e.currentTarget));try{const p=await api('/studio/create/preview',{method:'POST',body:JSON.stringify(createPayload)});createFingerprint=p.fingerprint;$('#create-plan').hidden=false;$('#create-plan').textContent=`Destination: ${p.destination}\n\nFiles:\n${p.files.map(f=>'  '+f.path).join('\n')}\n\nCommands:\n${p.lifecycle_commands.map(c=>'  '+c.join(' ')).join('\n')||'  none'}`;$('#create-confirm').disabled=false;status('#create-status','Review the plan, then create.')}catch(x){status('#create-status',x.message,false)}};
$('#create-confirm').onclick=async()=>{try{const r=await api('/studio/create',{method:'POST',body:JSON.stringify({...createPayload,accepted_plan:createFingerprint})});status('#create-status',`Created ${r.app_id} at ${r.root}`);$('#create-confirm').disabled=true;await loadApps()}catch(e){status('#create-status',e.message,false)}};
$('#import-form').onsubmit=async e=>{e.preventDefault();try{const r=await api('/studio/import',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});$('#import-result').hidden=false;$('#import-result').textContent=JSON.stringify(r,null,2);status('#import-status','Inspection complete')}catch(x){status('#import-status',x.message,false)}};
$('#run-diagnostics').onclick=async()=>{status('#diagnostics-status','Checking…');try{const[r,t]=await Promise.all([api('/diagnostics'),api('/studio/toolchains')]);$('#runtime-diagnostics').textContent=JSON.stringify(r,null,2);$('#toolchains').innerHTML=t.report.toolchains.map(x=>`<p><span class="pill">${x.available?'available':'missing'}</span> ${esc(x.display_name)} <span class="muted">${esc(x.version||'')}</span></p>`).join('');status('#diagnostics-status','Diagnostics complete')}catch(e){status('#diagnostics-status',e.message,false)}};
$('#refresh-apps').onclick=async()=>{try{await api('/catalog/refresh',{method:'POST'});await loadApps()}catch(e){status('#apps-status',e.message,false)}};loadApps();loadCreate();
</script></body></html>
