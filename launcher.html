<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>app-engine</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; font-family: system-ui, sans-serif;
         background: #0f1115; color: #e6e6e6; }
  #sidebar { width: 220px; flex: 0 0 220px; background: #15181f; border-right: 1px solid #262b36;
             overflow-y: auto; padding: 12px 0; }
  #sidebar h1 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
                color: #6b7280; margin: 4px 16px 12px; }
  .app-btn { display: flex; align-items: center; gap: 10px; width: 100%; border: 0;
             background: transparent; color: #cbd2dc; padding: 9px 16px; font-size: 14px;
             cursor: pointer; text-align: left; }
  .app-btn:hover { background: #1d2230; }
  .app-btn.active { background: #263041; color: #fff; }
  .app-btn .ico { font-size: 18px; width: 22px; text-align: center; }
  .app-btn .chat-dot { margin-left: auto; font-size: 11px; opacity: .5; }
  #main { flex: 1; position: relative; }
  .instance { position: absolute; inset: 0; display: none; }
  .instance.active { display: flex; }
  .instance iframe { flex: 1; border: 0; background: #fff; height: 100%; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center;
           justify-content: center; color: #4b5563; font-size: 15px; }
  /* chat panel */
  .chat { width: 340px; flex: 0 0 340px; background: #12151c; border-left: 1px solid #262b36;
          display: flex; flex-direction: column; }
  .chat-head { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #262b36; color: #9aa4b2; }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 11px; border-radius: 10px; font-size: 13px; line-height: 1.45; max-width: 90%;
         white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #2563eb; color: #fff; }
  .msg.assistant { align-self: flex-start; background: #1e2430; }
  .msg.error { background: #3b1d1d; color: #fca5a5; }
  .chat-in { display: flex; gap: 6px; padding: 10px; border-top: 1px solid #262b36; }
  .chat-in textarea { flex: 1; resize: none; background: #0d1016; color: #e6e6e6;
                      border: 1px solid #2b323f; border-radius: 8px; padding: 8px; font: inherit; }
  .chat-in button { background: #2563eb; color: #fff; border: 0; border-radius: 8px;
                    padding: 0 14px; cursor: pointer; }
  .chat-in button:disabled { opacity: .4; }
</style>
</head>
<body>
  <nav id="sidebar"><h1>Apps</h1><div id="applist"></div></nav>
  <div id="main"><div id="empty">Select an app →</div></div>

<script>
const state = { apps: [], instances: {}, active: null };

async function boot() {
  state.apps = await (await fetch('/api/apps')).json();
  const list = document.getElementById('applist');
  for (const app of state.apps) {
    const btn = document.createElement('button');
    btn.className = 'app-btn';
    btn.innerHTML = `<span class="ico">${app.icon}</span><span>${app.label}</span>` +
                    (app.chat_enabled ? `<span class="chat-dot">💬</span>` : '');
    btn.onclick = () => open(app, btn);
    list.appendChild(btn);
  }
}

function open(app, btn) {
  document.querySelectorAll('.app-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('empty').style.display = 'none';
  document.querySelectorAll('.instance').forEach(i => i.classList.remove('active'));

  if (state.instances[app.id]) {
    state.instances[app.id].classList.add('active');
    return;
  }
  const inst = document.createElement('div');
  inst.className = 'instance active';
  const iframe = document.createElement('iframe');
  if (app.sandbox) iframe.sandbox = app.sandbox;
  iframe.src = app.url;
  inst.appendChild(iframe);
  if (app.chat_enabled) inst.appendChild(buildChat(app));
  document.getElementById('main').appendChild(inst);
  state.instances[app.id] = inst;
}

function buildChat(app) {
  const messages = [];
  const panel = document.createElement('div');
  panel.className = 'chat';
  panel.innerHTML = `
    <div class="chat-head">💬 Q&A — ${app.label}</div>
    <div class="chat-msgs"></div>
    <div class="chat-in"><textarea rows="1" placeholder="Ask a question…"></textarea>
      <button>↑</button></div>`;
  const msgs = panel.querySelector('.chat-msgs');
  const ta = panel.querySelector('textarea');
  const send = panel.querySelector('button');

  const add = (role, text) => {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  };

  async function ask() {
    const text = ta.value.trim();
    if (!text) return;
    ta.value = '';
    messages.push({ role: 'user', content: text });
    add('user', text);
    const ai = add('assistant', '');
    send.disabled = ta.disabled = true;
    try {
      const resp = await fetch('/api/app-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ app_id: app.id, messages }),
      });
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let full = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        for (const line of dec.decode(value).split('\n')) {
          if (!line.startsWith('data: ')) continue;
          try {
            const d = JSON.parse(line.slice(6));
            if (d.type === 'token') { full += d.text; ai.textContent = full; msgs.scrollTop = msgs.scrollHeight; }
            else if (d.type === 'error') { ai.textContent = '⚠️ ' + d.error; ai.classList.add('error'); }
          } catch (e) {}
        }
      }
      if (full) messages.push({ role: 'assistant', content: full });
    } catch (e) {
      ai.textContent = '⚠️ connection failed';
      ai.classList.add('error');
    } finally {
      send.disabled = ta.disabled = false;
      ta.focus();
    }
  }
  send.onclick = ask;
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
  });
  return panel;
}

boot();
</script>
</body>
</html>
