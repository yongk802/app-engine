[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "app-engine"
version = "0.3.5"
description = "A standalone host runtime for Atrium-style apps"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "starlette>=0.49.1",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.scripts]
app-engine = "app_engine.__main__:main"
app-engine-manifest = "app_engine.__main__:manifest_main"
app-engine-players = "app_engine.__main__:players_main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true
py-modules = ["engine"]

[tool.setuptools.packages.find]
include = ["app_engine*"]

[tool.setuptools.package-data]
app_engine = [
    "*.json",
    "knowledge/**/*.json",
    "studio/**/*",
    "store_ui/**/*",
    "assistant_ui/*.js",
    "assistant_ui/*.css",
    "templates/**/*",
    "multiplayer/*.mjs",
]

[tool.setuptools.data-files]
"." = ["launcher.html", "app.schema.json", "model-registry.json"]
"knowledge" = ["knowledge/*.json"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-timeout==2.4.0",
    "setuptools==84.2.1",
    "wheel==0.48.0",
    "tomli>=2; python_version < '3.11'",
]
browser = ["playwright==1.63.0"]
